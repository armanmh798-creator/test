name: Trading Bot - Test Signal

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout bot
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check bot files
        run: |
          test -f run.py
          test -f engine.py
          python -m py_compile run.py engine.py
          echo "Bot files OK"

      - name: Send test notification
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          test -n "$NTFY_TOPIC"
          curl -f -X POST \
            -H "Title: Trading Bot TEST" \
            -H "Priority: high" \
            -d "Test successful! Notification system is working." \
            "https://ntfy.sh/$NTFY_TOPIC"

      - name: Finish
        run: echo "Test completed successfully!"
